[project]
name = "triagem"
version = "0.1.0"
description = "Triagem automática de laudos médicos por urgência (Tech Challenge MLOps)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "prometheus-client==0.26.0",
    "pydantic==2.13.5",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "numpy==2.5.3",
    "onnxruntime==1.30.0",
]

[project.optional-dependencies]
treino = ["pandas==3.0.6", "skl2onnx==1.20.0", "onnx==1.23.0"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.16.9",
    "httpx2==2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triagem"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
