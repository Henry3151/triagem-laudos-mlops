name: triagem

services:
  api:
    build: .
    image: triagem-api:local
    environment:
      MODEL_BACKEND: ${MODEL_BACKEND:-onnx}
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/triagem.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # Gerador de carga opcional, na mesma rede da API:
  #   docker compose --profile carga run --rm carga
  carga:
    image: triagem-api:local
    profiles: ["carga"]
    command:
      - python
      - /scripts/gerar_carga.py
      - --url=http://api:8000
      - --dados=/dados/laudos_sinteticos.csv
      - --duracao=${CARGA_DURACAO:-120}
      - --rps=${CARGA_RPS:-20}
    volumes:
      - ./scripts:/scripts:ro
      - ./data/raw:/dados:ro
    depends_on:
      - api
